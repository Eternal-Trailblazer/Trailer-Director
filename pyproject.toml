[project]
name = "autonomous-trailer-director"
version = "1.0.0"
description = "Autonomous Trailer Director for OTT Dialect Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
    "typing-extensions>=4.10.0",
    "streamlit>=1.30.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.90.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pyyaml>=6.0",
]

# This repository is a Streamlit application, not an installable library.
# Community Cloud uses Poetry for dependency resolution, so disable root-package
# installation and install only the declared runtime dependencies.
[tool.poetry]
package-mode = false

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[tool.ruff]
line-length = 100
target-version = "py311"
